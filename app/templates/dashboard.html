{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <h1 data-i18n="today.title"></h1>
    <p class="muted" id="today-date"></p>
  </div>
  <div class="row-actions" style="margin:0">
    <a class="btn btn--primary btn--sm" href="/medications?new=1" data-i18n="medication.add"></a>
    <a class="btn btn--ghost btn--sm" href="/appointments?new=1" data-i18n="appointment.add"></a>
    <a class="btn btn--ghost btn--sm" href="/doctors?new=1" data-i18n="doctor.add"></a>
  </div>
</div>

<section class="grid grid--two">
  <article class="card card--accent" id="next-dose-card">
    <h2 data-i18n="dashboard.next_dose"></h2>
    <div id="next-dose-body" class="card__body"></div>
  </article>

  <article class="card" id="next-appointment-card">
    <h2 data-i18n="dashboard.next_appointment"></h2>
    <div id="next-appointment-body" class="card__body"></div>
  </article>
</section>

<section id="ending-soon-section" class="section hidden">
  <h2 data-i18n="dashboard.ending_soon"></h2>
  <div id="ending-soon-list" class="stack"></div>
</section>

<section class="section">
  <div class="section__head">
    <h2 data-i18n="today.medications"></h2>
    <span class="pill" id="todays-summary"></span>
  </div>
  <div id="todays-doses" class="stack"></div>
</section>

<section class="section" id="todays-appointments-section">
  <h2 data-i18n="today.appointments"></h2>
  <div id="todays-appointments" class="stack"></div>
</section>

<section class="section">
  <h2 data-i18n="dashboard.active_medications"></h2>
  <div id="active-medications" class="grid grid--cards"></div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/js/today.js?v={{ version }}"></script>
{% endblock %}
