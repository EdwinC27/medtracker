{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <h1 data-i18n="settings.title"></h1>
</div>

<div class="filters" id="settings-tabs">
  <button class="chip is-active" type="button" data-tab="general" data-i18n="settings.tab_general"></button>
  <button class="chip" type="button" data-tab="security" data-i18n="settings.tab_security"></button>
  <button class="chip" type="button" data-tab="status" data-i18n="settings.tab_status"></button>
</div>

<section id="tab-general">
<form id="settings-form" class="stack">
  <section class="card">
    <h2 data-i18n="settings.appearance"></h2>
    <p class="hint" data-i18n="settings.theme_hint"></p>
    <div class="field">
      <label for="set-theme" data-i18n="settings.theme"></label>
      <select id="set-theme" name="theme">
        <option value="system" data-i18n="settings.theme_system"></option>
        <option value="light" data-i18n="settings.theme_light"></option>
        <option value="dark" data-i18n="settings.theme_dark"></option>
      </select>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="settings.language"></h2>
    <p class="hint" data-i18n="settings.language_hint"></p>
    <div class="field">
      <select id="set-language" name="language"></select>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="settings.schedule"></h2>

    <div class="field">
      <label for="set-first-dose" data-i18n="settings.default_first_dose_time"></label>
      <input id="set-first-dose" name="default_first_dose_time" type="time" required>
      <p class="hint" data-i18n="settings.default_first_dose_hint"></p>
      <p class="field__error" data-error-for="default_first_dose_time"></p>
    </div>

    <div class="field">
      <label for="set-ending-soon" data-i18n="settings.ending_soon_days"></label>
      <input id="set-ending-soon" name="ending_soon_days" type="number" min="0" max="60" required>
      <p class="hint" data-i18n="settings.ending_soon_hint"></p>
      <p class="field__error" data-error-for="ending_soon_days"></p>
    </div>

    <div class="field">
      <label for="set-missed" data-i18n="settings.missed_after_minutes"></label>
      <input id="set-missed" name="missed_after_minutes" type="number" min="5" max="1440" required>
      <p class="hint" data-i18n="settings.missed_after_hint"></p>
      <p class="field__error" id="grace-warning"></p>
      <p class="field__error" data-error-for="missed_after_minutes"></p>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="settings.notifications"></h2>

    <label class="check"><input type="checkbox" name="windows_notifications"> <span data-i18n="settings.windows_notifications"></span></label>
    <p class="hint" data-i18n="settings.windows_notifications_hint"></p>

    <label class="check"><input type="checkbox" name="browser_notifications"> <span data-i18n="settings.browser_notifications"></span></label>
    <p class="hint" data-i18n="settings.browser_notifications_hint"></p>

    <label class="check"><input type="checkbox" name="email_notifications"> <span data-i18n="settings.email_notifications"></span></label>
    <p class="hint" data-i18n="settings.email_notifications_hint"></p>
    <p class="field__error" data-error-for="email_notifications"></p>

    <label class="check"><input type="checkbox" name="medication_reminders"> <span data-i18n="settings.medication_reminders"></span></label>
    <label class="check"><input type="checkbox" name="appointment_reminders"> <span data-i18n="settings.appointment_reminders"></span></label>

    <h3 data-i18n="settings.dose_reminders"></h3>
    <p class="hint" data-i18n="settings.dose_reminders_hint"></p>
    <label class="check"><input type="checkbox" name="dose_before_30"> <span data-i18n="dose_offset.before_30"></span></label>
    <label class="check"><input type="checkbox" name="dose_before_15"> <span data-i18n="dose_offset.before_15"></span></label>
    <label class="check"><input type="checkbox" name="dose_before_5"> <span data-i18n="dose_offset.before_5"></span></label>
    <label class="check"><input type="checkbox" name="dose_at_time"> <span data-i18n="dose_offset.at_time"></span></label>
    <label class="check"><input type="checkbox" name="dose_after_15"> <span data-i18n="dose_offset.after_15"></span></label>
    <label class="check"><input type="checkbox" name="dose_after_30"> <span data-i18n="dose_offset.after_30"></span></label>
    <label class="check"><input type="checkbox" name="dose_overdue"> <span data-i18n="dose_offset.overdue"></span></label>

    <div class="field" style="margin-top:1rem">
      <label for="set-history-days" data-i18n="settings.notification_history"></label>
      <input id="set-history-days" name="notification_history_days" type="number" min="7" max="3650">
      <p class="hint" data-i18n="settings.notification_history_hint"></p>
      <p class="field__error" data-error-for="notification_history_days"></p>
    </div>

    <h3 data-i18n="settings.appointment_reminder_defaults"></h3>
    <p class="hint" data-i18n="settings.appointment_reminder_defaults_hint"></p>
    <label class="check"><input type="checkbox" name="appt_reminder_days_3"> <span data-i18n="reminder.days_3"></span></label>
    <label class="check"><input type="checkbox" name="appt_reminder_day_1"> <span data-i18n="reminder.day_1"></span></label>
    <label class="check"><input type="checkbox" name="appt_reminder_hours_3"> <span data-i18n="reminder.hours_3"></span></label>

    <div class="row-actions">
      <button type="button" class="btn btn--ghost btn--sm" id="request-permission" data-i18n="settings.permission_request"></button>
      <button type="button" class="btn btn--ghost btn--sm" id="test-notification" data-i18n="settings.test_notification"></button>
    </div>
    <p class="hint" id="permission-status"></p>
  </section>

  <section class="card">
    <h2 data-i18n="settings.email_section"></h2>
    <p class="hint" id="secret-backend-note"></p>

    <div class="field">
      <label for="set-email-to" data-i18n="settings.email_recipient"></label>
      <input id="set-email-to" name="email_recipient" type="email" maxlength="320" autocomplete="off">
      <p class="field__error" data-error-for="email_recipient"></p>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="set-smtp-host" data-i18n="settings.smtp_host"></label>
        <input id="set-smtp-host" name="smtp_host" type="text" maxlength="200" autocomplete="off">
      </div>
      <div class="field">
        <label for="set-smtp-port" data-i18n="settings.smtp_port"></label>
        <input id="set-smtp-port" name="smtp_port" type="number" min="1" max="65535">
        <p class="field__error" data-error-for="smtp_port"></p>
      </div>
    </div>

    <div class="field">
      <label for="set-smtp-security" data-i18n="settings.smtp_security"></label>
      <select id="set-smtp-security" name="smtp_security">
        <option value="starttls" data-i18n="settings.security_starttls"></option>
        <option value="ssl" data-i18n="settings.security_ssl"></option>
        <option value="none" data-i18n="settings.security_none"></option>
      </select>
    </div>

    <div class="field">
      <label for="set-smtp-user" data-i18n="settings.smtp_username"></label>
      <input id="set-smtp-user" name="smtp_username" type="text" maxlength="320" autocomplete="off">
    </div>

    <div class="field">
      <label for="set-smtp-password" data-i18n="settings.smtp_password"></label>
      <input id="set-smtp-password" name="smtp_password" type="password" autocomplete="new-password">
      <p class="hint" data-i18n="settings.smtp_password_hint"></p>
      <p class="hint" id="smtp-password-state"></p>
    </div>

    <div class="field">
      <label for="set-email-from" data-i18n="settings.email_sender"></label>
      <input id="set-email-from" name="email_sender" type="email" maxlength="320" autocomplete="off">
      <p class="hint" data-i18n="settings.email_sender_hint"></p>
      <p class="field__error" data-error-for="email_sender"></p>
    </div>

    <p class="hint" data-i18n="settings.gmail_hint"></p>

    <div class="row-actions">
      <button type="button" class="btn btn--ghost btn--sm" id="test-email" data-i18n="settings.test_email"></button>
    </div>
    <p class="hint" id="email-test-result"></p>
  </section>

  <section class="card" id="data-backup">
    <h2 data-i18n="settings.data_backup"></h2>

    <label class="check"><input type="checkbox" name="backup_enabled"> <span data-i18n="settings.automatic_backup"></span></label>
    <p class="hint" data-i18n="settings.automatic_backup_hint"></p>

    <div class="field-row">
      <div class="field">
        <label for="set-backup-frequency" data-i18n="settings.backup_frequency"></label>
        <select id="set-backup-frequency" name="backup_frequency">
          <option value="daily" data-i18n="settings.backup_daily"></option>
          <option value="weekly" data-i18n="settings.backup_weekly"></option>
        </select>
        <p class="field__error" data-error-for="backup_frequency"></p>
      </div>
      <div class="field">
        <label for="set-backup-time" data-i18n="settings.backup_time"></label>
        <input id="set-backup-time" name="backup_time" type="time">
        <p class="field__error" data-error-for="backup_time"></p>
      </div>
    </div>

    <div class="field">
      <label for="set-backup-keep" data-i18n="settings.backup_keep"></label>
      <select id="set-backup-keep" name="backup_keep"></select>
      <p class="hint" data-i18n="settings.backup_keep_hint"></p>
      <p class="field__error" data-error-for="backup_keep"></p>
    </div>

    <div class="field">
      <label for="set-backup-location" data-i18n="settings.backup_location"></label>
      <input id="set-backup-location" name="backup_location" type="text" class="mono">
      <p class="hint" data-i18n="settings.backup_location_hint"></p>
      <p class="field__error" data-error-for="backup_location"></p>
    </div>

    <dl class="meta-list">
      <dt data-i18n="settings.last_backup"></dt><dd id="last-backup">—</dd>
    </dl>

    <div class="row-actions">
      <button type="button" class="btn btn--ghost btn--sm" id="backup-now" data-i18n="settings.backup_now"></button>
    </div>

    <h3 data-i18n="settings.existing_backups"></h3>
    <div id="backup-list" class="stack"></div>
  </section>

  <section class="card">
    <h2 data-i18n="settings.export_data"></h2>
    <p class="hint" data-i18n="settings.export_hint"></p>

    <div class="field">
      <label for="set-export-format" data-i18n="settings.export_format"></label>
      <select id="set-export-format">
        <option value="csv" data-i18n="export.format_csv"></option>
        <option value="json" selected data-i18n="export.format_json"></option>
        <option value="pdf" data-i18n="export.format_pdf"></option>
      </select>
    </div>

    <div class="field">
      <span class="label" data-i18n="settings.export_datasets"></span>
      <label class="check"><input type="checkbox" data-dataset="medications" checked> <span data-i18n="export.dataset_medications"></span></label>
      <label class="check"><input type="checkbox" data-dataset="doses" checked> <span data-i18n="export.dataset_doses"></span></label>
      <label class="check"><input type="checkbox" data-dataset="appointments" checked> <span data-i18n="export.dataset_appointments"></span></label>
      <label class="check"><input type="checkbox" data-dataset="doctors" checked> <span data-i18n="export.dataset_doctors"></span></label>
      <label class="check"><input type="checkbox" data-dataset="timeline" checked> <span data-i18n="export.dataset_timeline"></span></label>
    </div>

    <div class="row-actions">
      <button type="button" class="btn btn--ghost btn--sm" id="export-run" data-i18n="settings.export_data"></button>
      <a class="btn btn--primary btn--sm hidden" id="export-download" data-i18n="export.download"></a>
    </div>

    <h3 data-i18n="settings.import_data"></h3>
    <p class="hint" data-i18n="settings.import_hint"></p>
    <div class="field">
      <input id="import-file" type="file" accept="application/json,.json">
      <label class="check"><input type="checkbox" id="import-settings"> <span data-i18n="settings.import_settings_too"></span></label>
    </div>
    <div id="import-preview"></div>
    <div class="row-actions">
      <button type="button" class="btn btn--ghost btn--sm" id="import-run" data-i18n="settings.import_data"></button>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="settings.system"></h2>
    <label class="check">
      <input type="checkbox" name="start_with_windows">
      <span data-i18n="settings.start_with_windows"></span>
    </label>
    <p class="hint" data-i18n="settings.start_with_windows_hint"></p>
    <p class="hint" id="startup-note"></p>
    <dl class="meta-list">
      <dt data-i18n="settings.scheduler_status"></dt><dd id="scheduler-status">—</dd>
      <dt data-i18n="settings.database_location"></dt><dd id="database-path" class="mono">—</dd>
      <dt data-i18n="settings.version"></dt><dd id="app-version">—</dd>
    </dl>
    <p class="hint" id="windows-availability"></p>
  </section>

  <div class="sticky-actions">
    <button type="submit" class="btn btn--primary" data-i18n="common.save"></button>
  </div>
</form>
</section>

<section id="tab-security" class="hidden stack">
  <div class="card">
    <h2 data-i18n="security.app_lock"></h2>
    <p class="hint" data-i18n="security.app_lock_hint"></p>
    <p><span class="badge" id="lock-state-badge">—</span></p>

    <!-- Turning the lock on: a new PIN, twice. -->
    <form id="lock-enable-form" class="form hidden">
      <div class="field-row">
        <div class="field">
          <label for="lock-new-pin" data-i18n="security.create_pin"></label>
          <input id="lock-new-pin" name="pin" type="password" inputmode="numeric"
                 pattern="[0-9]*" maxlength="6" autocomplete="off" required>
          <p class="field__error" data-error-for="pin"></p>
        </div>
        <div class="field">
          <label for="lock-confirm-pin" data-i18n="security.confirm_pin"></label>
          <input id="lock-confirm-pin" name="confirm_pin" type="password" inputmode="numeric"
                 pattern="[0-9]*" maxlength="6" autocomplete="off" required>
          <p class="field__error" data-error-for="confirm_pin"></p>
        </div>
      </div>
      <p class="hint" id="lock-pin-rule"></p>
      <button type="submit" class="btn btn--primary" data-i18n="security.enable"></button>
    </form>

    <!-- Turning it off, or changing the PIN: both need the current one. -->
    <div id="lock-on-panel" class="hidden stack">
      <div class="field">
        <label for="lock-auto" data-i18n="security.auto_lock"></label>
        <select id="lock-auto"></select>
      </div>

      <form id="lock-change-form" class="form">
        <h3 data-i18n="security.change_pin"></h3>
        <div class="field-row">
          <div class="field">
            <label for="lock-current-pin" data-i18n="security.current_pin"></label>
            <input id="lock-current-pin" name="current_pin" type="password" inputmode="numeric"
                   pattern="[0-9]*" maxlength="6" autocomplete="off" required>
            <p class="field__error" data-error-for="current_pin"></p>
          </div>
          <div class="field">
            <label for="lock-change-new" data-i18n="security.new_pin"></label>
            <input id="lock-change-new" name="pin" type="password" inputmode="numeric"
                   pattern="[0-9]*" maxlength="6" autocomplete="off" required>
            <p class="field__error" data-error-for="pin"></p>
          </div>
          <div class="field">
            <label for="lock-change-confirm" data-i18n="security.confirm_pin"></label>
            <input id="lock-change-confirm" name="confirm_pin" type="password" inputmode="numeric"
                   pattern="[0-9]*" maxlength="6" autocomplete="off" required>
            <p class="field__error" data-error-for="confirm_pin"></p>
          </div>
        </div>
        <button type="submit" class="btn btn--primary btn--sm" data-i18n="security.change_pin"></button>
      </form>

      <form id="lock-disable-form" class="form">
        <h3 data-i18n="security.disable"></h3>
        <div class="field">
          <label for="lock-disable-pin" data-i18n="security.current_pin"></label>
          <input id="lock-disable-pin" name="current_pin" type="password" inputmode="numeric"
                 pattern="[0-9]*" maxlength="6" autocomplete="off" required>
          <p class="field__error" data-error-for="current_pin"></p>
        </div>
        <button type="submit" class="btn btn--danger btn--sm" data-i18n="security.disable"></button>
      </form>

      <div class="row-actions">
        <button type="button" class="btn btn--ghost btn--sm" id="lock-now"
                data-i18n="security.lock_now"></button>
      </div>
    </div>
  </div>
</section>

<section id="tab-status" class="hidden stack">
  <div id="status-body"><p class="muted" data-i18n="common.loading"></p></div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/js/settings.js?v={{ version }}"></script>
<script src="/static/js/settings_v4.js?v={{ version }}"></script>
{% endblock %}
